# Netlify configuration for a React + TanStack Start (Vite) project.
# Docs: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # Install dependencies, then produce the production bundle.
  command = "npm run build"
  # Vite writes the client bundle here (see .gitignore: "dist").
  publish = "dist"

[build.environment]
  # Keep the build on a modern, LTS-aligned Node version.
  NODE_VERSION = "22"

# SPA fallback: let TanStack Router own client-side routes so a hard refresh
# on a deep link (e.g. /some/route) serves the app instead of a 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-lived caching for hashed build assets.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
